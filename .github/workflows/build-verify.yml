name: vmv-build-verify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Astro site
        run: npm run build

      - name: Verify static artifact
        shell: bash
        run: |
          test -f dist/index.html
          test -f dist/privacy/index.html || test -f dist/privacy.html
          test -f dist/terms/index.html || test -f dist/terms.html
          test -f dist/accessibility/index.html || test -f dist/accessibility.html
          test -f dist/icons/vmv-icon.png
          if grep -RniE 'MIDASII|SOURCE_ROUTER|SOURCE_REGISTRY|Project Instructions|localhost|vercel\.app' dist; then
            echo 'Forbidden internal or preview string found in dist.'
            exit 1
          fi
          echo 'VMV_BUILD_VERIFY_PASS'
