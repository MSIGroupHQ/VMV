name: localize-vmv-assets

on:
  push:
    branches: [main]
    paths:
      - 'scripts/localize_vmv_assets.py'
      - '.github/workflows/localize-vmv-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow requests

      - name: Download and convert original Wix imagery
        run: python scripts/localize_vmv_assets.py

      - name: Commit localized image binaries
        shell: bash
        run: |
          if git status --porcelain public/images/vmv | grep -q .; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add public/images/vmv
            git commit -m 'Localize original VMV images as WebP'
            git push
          else
            echo 'VMV images already localized.'
          fi
